# Application configuration for running in containers and Azure Container Apps

# Server port (Container Apps expects the container to listen on this port)
server.port=8080

# H2 in-memory database configuration (preserves existing behavior)
spring.datasource.url=jdbc:h2:mem:fake-monolith;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf configuration (keep defaults; configured here for clarity)
spring.thymeleaf.cache=true

# Actuator endpoints for health and readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.server.port=${server.port}

# Logging
logging.level.org.springframework=INFO
logging.level.com.example.monolith=INFO
