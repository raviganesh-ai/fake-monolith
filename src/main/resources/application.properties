# Server
server.port=8080

# Embedded in-memory H2, re-created and re-seeded on every startup
spring.datasource.url=jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate: create the schema on startup (ephemeral fixture)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=true

# H2 console disabled by default (teaching toggle only)
spring.h2.console.enabled=false

# Thymeleaf: disable template caching for local development
spring.thymeleaf.cache=false
