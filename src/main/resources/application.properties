# Spring Boot application configuration

# Server port (can be overridden by SERVER_PORT env variable in container)
server.port=${SERVER_PORT:8080}

# H2 in-memory database configuration (preserving existing behavior)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable Spring Boot Actuator basic endpoints for health and info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.server.port=${MANAGEMENT_SERVER_PORT:${SERVER_PORT:8080}}
management.server.base-path=/actuator

# Thymeleaf template configuration (default behavior preserved)
spring.thymeleaf.cache=false

# Logging configuration suitable for container environments
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
