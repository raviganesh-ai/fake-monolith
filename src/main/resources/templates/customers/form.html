<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('New customer')"></head>
<body>
<nav th:replace="fragments :: nav"></nav>
<main>
    <h1>New customer</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form method="post" th:action="@{/customers}">
        <p><label for="name">Name</label><input id="name" name="name" th:value="${name}" required></p>
        <p><label for="email">Email</label><input id="email" name="email" type="email" th:value="${email}"></p>
        <p><label for="phone">Phone</label><input id="phone" name="phone" th:value="${phone}"></p>
        <p><label for="address">Address</label><input id="address" name="address" th:value="${address}"></p>
        <p><button type="submit">Save</button> <a th:href="@{/customers}">Cancel</a></p>
    </form>
</main>
</body>
</html>
