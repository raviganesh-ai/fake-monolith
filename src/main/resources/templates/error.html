<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Error')"></head>
<body>
<nav th:replace="fragments :: nav"></nav>
<main>
    <h1>Something went wrong</h1>
    <p th:text="${message} ?: 'The page could not be displayed.'">An error occurred.</p>
    <p><a th:href="@{/}">Return to home</a></p>
</main>
</body>
</html>
