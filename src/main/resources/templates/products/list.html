<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Products')"></head>
<body>
<nav th:replace="fragments :: nav"></nav>
<main>
    <h1>Products</h1>
    <p><a class="button" th:href="@{/products/new}">New product</a></p>
    <table>
        <thead>
        <tr><th>ID</th><th>SKU</th><th>Name</th><th>Unit price</th><th>Stock</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.sku}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.unitPrice}"></td>
            <td th:text="${p.quantityOnHand}"></td>
            <td><a th:href="@{'/products/' + ${p.id} + '/edit'}">Edit</a></td>
        </tr>
        <tr th:if="${products.isEmpty()}"><td colspan="6">No records</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
