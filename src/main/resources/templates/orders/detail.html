<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Order detail')"></head>
<body>
<nav th:replace="fragments :: nav"></nav>
<main>
    <h1>Order #<span th:text="${order.id}"></span></h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p>Customer: <strong th:text="${order.customer.name}"></strong></p>
    <p>Date: <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></span></p>
    <p>Status: <strong th:text="${order.status}"></strong></p>

    <table>
        <thead>
        <tr><th>Product</th><th>Quantity</th><th>Unit price</th><th>Line total</th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.product.name}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.unitPriceAtOrder}"></td>
            <td th:text="${item.lineTotal}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr><th colspan="3">Order total</th><th th:text="${order.totalAmount}"></th></tr>
        </tfoot>
    </table>

    <h2>Change status</h2>
    <form method="post" th:action="@{'/orders/' + ${order.id} + '/status'}">
        <button type="submit" name="action" value="confirm">Confirm</button>
        <button type="submit" name="action" value="ship">Ship</button>
        <button type="submit" name="action" value="cancel"
                onclick="return confirm('Cancel this order and restock its items?');">Cancel</button>
    </form>
    <p><a th:href="@{/orders}">Back to orders</a></p>
</main>
</body>
</html>
